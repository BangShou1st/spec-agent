spring:
  application:
    name: spec-agent
  datasource:
    url: jdbc:postgresql://localhost:5434/spec_agent_test
    username: spec_agent
    password: spec_agent_dev
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  session:
    jdbc:
      initialize-schema: never
    timeout: 30m

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.specagent: DEBUG
    org.springframework.jdbc: DEBUG
    org.flywaydb: DEBUG

spec:
  embedding-settings:
    worker-enabled: false
  agent:
    security:
      # 测试档显式 LOCAL：既有测试不驱动登录流程。身份模式准入仍会校验
      # 数据库登记行（V59 默认 LOCAL），因此"模式分歧拒绝启动"这条路径
      # 在测试里也是真实生效的。
      mode: LOCAL
      mode-admission-enabled: true
    retrieval:
      embedding:
        provider: ${SPEC_AGENT_EMBEDDING_PROVIDER:noop}
        worker:
          enabled: false
    model:
      gateway: fake
      inference: fake
    brain:
      # Tests drive RunWorker synchronously through test drivers; the
      # background poller stays off to keep runs deterministic. (An env var
      # such as SPEC_AGENT_BRAIN_WORKER_ENABLED=true still overrides this.)
      enabled: false
      engine: ${SPEC_AGENT_BRAIN_ENGINE:fake}
      # Deterministic internal token for the test profile (matches the
      # test-suite default); production installs generate a per-install file.
      internal-secret: dev-internal-secret
      worker:
        enabled: false
    secret:
      # Deterministic test master key (32 bytes base64) so this profile
      # decrypts the same encrypted fixtures as the unit-test suite. The
      # test database therefore holds ciphertext under THIS key id; running
      # against it with a different master key fails closed by design.
      master-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    skill:
      builtin:
        # Built-in skill packages are shipped for product/testing use, but the
        # skill integration tests assert exact catalog states (empty before
        # install, one entry after), so they must not be seeded into the test DB.
        seed-enabled: false
