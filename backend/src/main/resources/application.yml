spring:
  application:
    name: spec-agent
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://${SPEC_AGENT_DB_HOST:localhost}:${SPEC_AGENT_DB_PORT:5434}/${SPEC_AGENT_DB_NAME:spec_agent}
    username: ${SPEC_AGENT_DB_USER:spec_agent}
    password: ${SPEC_AGENT_DB_PASSWORD:spec_agent_dev}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.specagent: INFO
    org.springframework.jdbc: WARN
    org.flywaydb: INFO

spec:
  agent:
    credential:
      # External master key for AES-GCM credential encryption. Must come from
      # environment configuration (SPEC_AGENT_CREDENTIAL_MASTER_KEY); never
      # commit a real master key.
      master-key: ${SPEC_AGENT_CREDENTIAL_MASTER_KEY:}
    model:
      opencode:
        # Explicit selected OpenCode model id; blank means the real gateway is
        # not configured. Free models are discovered dynamically at runtime.
        model: ${SPEC_AGENT_OPENCODE_MODEL:}
        timeout-seconds: ${SPEC_AGENT_OPENCODE_TIMEOUT_SECONDS:45}