spring:
  application:
    name: spec-agent
  mvc:
    async:
      # Native GA broker streams share the host's absolute 180-second execution fence.
      request-timeout: 180s
  task:
    scheduling:
      # 除独立心跳执行器之外，共享的 @Scheduled 线程池也必须多于一个：执行线程
      # 在长模型调用中阻塞时，撤销、跨实例 SSE 补发、准入核验等调度不能被一起
      # 饿死。缺失时 Boot 默认单线程，长任务会连带停掉这些收敛路径。
      pool:
        size: 4
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://${SPEC_AGENT_DB_HOST:localhost}:${SPEC_AGENT_DB_PORT:5434}/${SPEC_AGENT_DB_NAME:spec_agent}
    username: ${SPEC_AGENT_DB_USER:spec_agent}
    password: ${SPEC_AGENT_DB_PASSWORD:spec_agent_dev}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  session:
    # 第二阶段：会话存在 PostgreSQL（表由 Flyway V60 建立），因此 API 多实例
    # 不要求粘性会话。现阶段不为会话额外引入 Redis；只有测量证明确有压力后
    # 才替换会话存储。
    # initialize-schema 必须为 never：本项目的 schema 事实源只能是
    # db/migration（validate-on-migrate 已开启），让 Boot 自动建表会产生
    # 两套不可审计的 DDL。
    jdbc:
      initialize-schema: never
    # 空闲超时初值 30 分钟（待评估参数，不是承载承诺）。
    timeout: ${SPEC_AGENT_SECURITY_IDLE_TIMEOUT:30m}

server:
  port: ${SERVER_PORT:8080}
  # 本机单用户交付:默认只绑定回环接口,不向局域网暴露产品 API。
  # 需要非本机访问时必须显式设置 SERVER_ADDRESS 并提供认证入口,
  # 且通过 SPEC_AGENT_ALLOW_NON_LOOPBACK=true 确认接受风险
  # (启动守卫 LoopbackBindingGuard 强制此决定)。
  address: ${SERVER_ADDRESS:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.specagent: INFO
    org.springframework.jdbc: WARN
    org.flywaydb: INFO

opencode:
  zen:
    user-agent: ${SPEC_AGENT_MODEL_USER_AGENT:opencode/1.19.0 ai-sdk/provider-utils/4.0.23 runtime/bun/1.3.14}

# Kilo Gateway（第三个模型供应商，OpenAI 兼容）。以下只提供 Starter 绑定的默认值：
# 免费模型匿名可用，付费模型必须在设置页显式提供 API Key。刻意不配置备用模型，
# 因此不存在隐式提供商降级/回退。
kilo:
  gateway:
    model: ${KILO_GATEWAY_MODEL:poolside/laguna-s-2.1:free}
    free-only: false

spec:
  global-assistant:
    brain-base-url: ${SPEC_AGENT_GA_BRAIN_BASE_URL:http://127.0.0.1:8101}
    tavily-api-key: ${SPEC_AGENT_TAVILY_API_KEY:}
    retrieval-enabled: ${SPEC_AGENT_GA_RETRIEVAL_ENABLED:true}
    engine: ${SPEC_AGENT_GLOBAL_ASSISTANT_ENGINE:langchain-ga.v1}
    # GA 原生工具调用的逐模型资格登记。刻意显式:提供商已接入 != Chat 可用 !=
    # 支持原生 Tool Calling != GA 实际执行已验证。OpenCode Zen 沿用既有规则
    # (可信元数据确认 Chat Completions);Kilo Gateway 只承认这里显式登记的模型,
    # 绝不按 :free 后缀或"是个 Chat 模型"推断。资格证据见 docs/MODEL_GATEWAY.md §18。
    ga-native:
      # 只有这里登记的 Kilo 模型才可进入 GA 原生工具调用。登记依据是
      # `gradlew.bat qualifyGaNativeKilo` 的 5 项真实资格检查(见
      # docs/MODEL_GATEWAY.md §18 与 docs/v2/evidence/KILO_GA_NATIVE_QUALIFICATION.json)。
      kilo-qualified-models:
        - poolside/laguna-s-2.1:free
        - cohere/north-mini-code:free
  agent:
    security:
      # 第二阶段：身份模式。默认 LOCAL —— 单机回环绑定 + 显式本地 user/org。
      # LOCAL 不是匿名管理员：每个请求都绑定到可禁用、可审计的本地主体。
      # 切换到 OIDC 是显式的部署动作：停全部实例 -> 改写 security_mode 登记行
      # -> 启动新舰队。缺配置时拒绝启动，绝不自动回退 LOCAL。
      mode: ${SPEC_AGENT_SECURITY_MODE:LOCAL}
      # 单配置 issuer；数据结构（user_identities.issuer）允许以后接多个。
      issuer-uri: ${SPEC_AGENT_SECURITY_ISSUER_URI:}
      # 数据库范围的身份模式准入校验。生产不得关闭（测试豁免见 application-test.yml）。
      mode-admission-enabled: ${SPEC_AGENT_SECURITY_MODE_ADMISSION_ENABLED:true}
      # 绝对登录期限初值 8 小时（待评估参数，不是承载承诺）。
      absolute-timeout: ${SPEC_AGENT_SECURITY_ABSOLUTE_TIMEOUT:8h}
      local-org-name: ${SPEC_AGENT_SECURITY_LOCAL_ORG_NAME:Local Workspace}
      local-user-name: ${SPEC_AGENT_SECURITY_LOCAL_USER_NAME:Local User}
    action-eligibility:
      mode: ${SPEC_AGENT_ACTION_ELIGIBILITY_MODE:enforced}
    model:
      # Normal product execution always resolves the global settings aggregate.
      # The fake gateway is test-only and must be selected explicitly there.
      gateway: ${SPEC_AGENT_MODEL_GATEWAY:opencode}
      # Lower-level inference seam used by the internal broker for the Python
      # brain. Shares the frozen OpenCode transport; fake is test-only.
      inference: ${SPEC_AGENT_MODEL_INFERENCE:opencode}
      # Production remains database-backed. The live evaluation suite opts
      # into external-environment explicitly and never falls back to a DB row.
      runtime-settings-source: ${SPEC_AGENT_MODEL_RUNTIME_SETTINGS_SOURCE:database}
      opencode:
        settings-timeout-seconds: ${SPEC_AGENT_OPENCODE_SETTINGS_TIMEOUT_SECONDS:45}
    brain:
      # Post-cutover production runtime. The async AgentRun path (Answer /
      # Draft / Spec / Regenerate / NodeQuery) is the ONLY production mutation
      # path, so both the remote Python brain boundary and the background
      # worker are ON by default in the default profile. Every queued run must
      # have a live executor; disable these only for tests or special
      # deployments that intentionally run API-only pods.
      enabled: ${SPEC_AGENT_BRAIN_ENABLED:true}
      base-url: ${SPEC_AGENT_BRAIN_BASE_URL:http://localhost:8100}
      # One brain inference call may legitimately take minutes on slow
      # provider days; killing it early wastes the completed model response.
      connect-timeout-ms: ${SPEC_AGENT_BRAIN_CONNECT_TIMEOUT_MS:2000}
      read-timeout-seconds: ${SPEC_AGENT_BRAIN_READ_TIMEOUT_SECONDS:300}
      # 内部密钥不再有仓库级的固定默认值:未配置时由
      # InstallInternalSecret 在首次启动生成安装实例独有的随机密钥并
      # 持久化到 ./data/internal-secret.txt,后端与 Brain 使用同一值。
      # CI/测试通过环境变量或 test profile 显式注入确定性值。
      internal-secret: ${SPEC_AGENT_BRAIN_INTERNAL_SECRET:}
      engine: ${SPEC_AGENT_BRAIN_ENGINE:remote-python}
      worker:
        # Must stay enabled in any deployment whose API accepts
        # POST /agent-runs; the health endpoint reports AGENT_WORKER_UNAVAILABLE
        # when this process accepts runs without its own executor.
        enabled: ${SPEC_AGENT_BRAIN_WORKER_ENABLED:true}
        poll-interval-ms: ${SPEC_AGENT_BRAIN_WORKER_POLL_INTERVAL_MS:2000}
        # Startup orphan recovery: on boot, runs left non-terminal by a dead
        # executor are honestly terminalized as failed (no replay of model
        # calls, answers or external side effects). Valid for the supported
        # single-instance deployment only; disable when a second live
        # executor process could own runs in the same database.
        startup-recovery: ${SPEC_AGENT_BRAIN_WORKER_STARTUP_RECOVERY:true}
      broker:
        max-prompt-chars: ${SPEC_AGENT_BROKER_MAX_PROMPT_CHARS:200000}
        max-output-tokens: ${SPEC_AGENT_BROKER_MAX_OUTPUT_TOKENS:32768}
    loop:
      # Total AgentRuns allowed in one autonomous continuation chain, the
      # chain root (cycle 0) included. Bounds execution volume only; the
      # remaining budget always derives from the persisted cycle index, so
      # no remaining-budget counter is stored anywhere.
      max-cycles: ${SPEC_AGENT_LOOP_MAX_CYCLES:3}
    capability:
      # Deterministic planner-facing capability catalog bounds. Model output
      # can never change these limits.
      max-visible: ${SPEC_AGENT_CAPABILITY_CATALOG_MAX_VISIBLE:32}
      max-descriptor-bytes: ${SPEC_AGENT_CAPABILITY_CATALOG_MAX_DESCRIPTOR_BYTES:2048}
      max-description-chars: ${SPEC_AGENT_CAPABILITY_CATALOG_MAX_DESCRIPTION_CHARS:320}
    retrieval:
      engine: ${SPEC_AGENT_RETRIEVAL_ENGINE:java-hybrid.v1}
      # Vector enrichment is optional; lexical/trigram/graph retrieval remains
      # the correctness path when no provider is configured.
      embedding:
        provider: ${SPEC_AGENT_EMBEDDING_PROVIDER:noop}
        worker:
          enabled: ${SPEC_AGENT_EMBEDDING_WORKER_ENABLED:true}
          interval-ms: ${SPEC_AGENT_EMBEDDING_WORKER_INTERVAL_MS:5000}
    skill:
      # Skill import security bounds (ZIP/git). Conservative by default;
      # scripts and dependency installation never run during validate/install.
      max-archive-bytes: ${SPEC_AGENT_SKILL_MAX_ARCHIVE_BYTES:2097152}
      max-extracted-bytes: ${SPEC_AGENT_SKILL_MAX_EXTRACTED_BYTES:10485760}
      max-files: ${SPEC_AGENT_SKILL_MAX_FILES:256}
      max-depth: ${SPEC_AGENT_SKILL_MAX_DEPTH:8}
      max-path-chars: ${SPEC_AGENT_SKILL_MAX_PATH_CHARS:512}
      # Discovery/catalog bounds.
      max-visible: ${SPEC_AGENT_SKILL_CATALOG_MAX_VISIBLE:24}
      max-metadata-bytes: ${SPEC_AGENT_SKILL_CATALOG_MAX_METADATA_BYTES:4096}
      max-description-chars: ${SPEC_AGENT_SKILL_CATALOG_MAX_DESCRIPTION_CHARS:320}
      search-max-results: ${SPEC_AGENT_SKILL_SEARCH_MAX_RESULTS:10}
      activation-max-instruction-bytes: ${SPEC_AGENT_SKILL_ACTIVATION_MAX_INSTRUCTION_BYTES:60000}
      resource-max-inline-bytes: ${SPEC_AGENT_SKILL_RESOURCE_MAX_INLINE_BYTES:20000}
      max-resources-listed: ${SPEC_AGENT_SKILL_MAX_RESOURCES_LISTED:500}
      # Git import bounds.
      git-clone-bytes: ${SPEC_AGENT_SKILL_GIT_CLONE_BYTES:10485760}
      git-timeout-seconds: ${SPEC_AGENT_SKILL_GIT_TIMEOUT_SECONDS:30}
      git-max-redirects: ${SPEC_AGENT_SKILL_GIT_MAX_REDIRECTS:3}
      # DB-authoritative local mirror of installed packages (builtin, git and
      # uploaded alike) so users can browse/backup their skills on disk. The
      # database is never read back from this tree; missing files self-heal.
      # Default keeps the mirror INSIDE the project tree: relative to the
      # backend working directory (backend/data/skills in dev). Override with
      # SPEC_AGENT_SKILL_LOCAL_MIRROR_ROOT to point it anywhere else.
      local-mirror-enabled: ${SPEC_AGENT_SKILL_LOCAL_MIRROR_ENABLED:true}
      local-mirror-root: ${SPEC_AGENT_SKILL_LOCAL_MIRROR_ROOT:./data/skills}
    mcp:
      # Remote MCP runtime bounds. Model output can never change these.
      discovery-timeout-ms: ${SPEC_AGENT_MCP_DISCOVERY_TIMEOUT_MS:10000}
      call-timeout-ms: ${SPEC_AGENT_MCP_CALL_TIMEOUT_MS:15000}
      result-max-inline-bytes: ${SPEC_AGENT_MCP_RESULT_MAX_INLINE_BYTES:30000}
      connection-max-redirects: ${SPEC_AGENT_MCP_CONNECTION_MAX_REDIRECTS:3}
      connection-max-metadata-bytes: ${SPEC_AGENT_MCP_CONNECTION_MAX_METADATA_BYTES:4096}
      max-description-chars: ${SPEC_AGENT_MCP_MAX_DESCRIPTION_CHARS:320}
      # Explicit opt-in for localhost HTTP MCP servers (test/local tooling).
      # Default off; the shared outbound policy otherwise blocks loopback.
      allow-localhost-http: ${SPEC_AGENT_MCP_ALLOW_LOCALHOST_HTTP:false}
    # ---------------------------------------------------------------------------
    # 多 Worker 持久化调度(见 docs/v2/PHASE1_MULTI_WORKER_EXECUTION_DESIGN.md)。
    # 全部为可配置的实验初值:只有测量之后才能成为承载承诺,容量数字不承诺
    # 具体用户数或生产吞吐。
    #
    # multi-worker-enabled 是"选择哪一套调度器"的总开关,也是禁止新旧调度器
    # 混跑的强制点:未启用时公共调度层既不登记任务也不参与认领(否则任务永无人
    # 消费,配额会被虚假积压占满),旧调度器行为与历史完全一致。启用后全库单
    # 执行器租约不再取得,所有权下沉到任务级执行代次 + 租约 + 任务行排他锁。
    # ---------------------------------------------------------------------------
    execution:
      multi-worker-enabled: ${SPEC_AGENT_MULTI_WORKER_ENABLED:false}
      # 数据库范围的调度模式准入协议(design §11"禁止新旧调度器混跑"的强制形式):
      # 启动时校验 runtime_execution_mode 登记的模式与本实例一致,不一致拒绝启动;
      # 任务级实例(含 API-only)另持 executor 键的共享 advisory lock,使旧单执行器
      # 实例无法进入舰队(反之亦然)。模式切换走维护窗口:停全部实例、显式改写
      # 登记行、再启动新舰队。仅供测试关闭;生产不得关闭。
      mode-admission-enabled: ${SPEC_AGENT_EXECUTION_MODE_ADMISSION:true}
      # 准入共享锁的周期验证间隔(连接死亡/锁被撤销后 fail-closed 闩锁)。
      admission-verify-interval-ms: ${SPEC_AGENT_EXECUTION_ADMISSION_VERIFY_MS:5000}
      # 本进程实际空闲执行槽(本地并发上限,不是全局限额)。
      local-slots: ${SPEC_AGENT_EXECUTION_LOCAL_SLOTS:2}
      # 租约与心跳:续租间隔必须显著小于租约时长。
      lease-seconds: ${SPEC_AGENT_EXECUTION_LEASE_SECONDS:60}
      heartbeat-seconds: ${SPEC_AGENT_EXECUTION_HEARTBEAT_SECONDS:10}
      # 认领轮询与过期扫描。
      claim-interval-ms: ${SPEC_AGENT_EXECUTION_CLAIM_INTERVAL_MS:500}
      expiry-scan-interval-ms: ${SPEC_AGENT_EXECUTION_EXPIRY_SCAN_INTERVAL_MS:5000}
      # 每次扫描的候选上限(有界扫描,避免同一个繁忙项目挡住其他项目)。
      claim-scan-limit: ${SPEC_AGENT_EXECUTION_CLAIM_SCAN_LIMIT:8}
      # 有界恢复次数。
      max-attempts: ${SPEC_AGENT_EXECUTION_MAX_ATTEMPTS:3}
      # 绝对总截止时间:首次实际执行时固定,恢复绝不重置。
      workspace-timeout-seconds: ${SPEC_AGENT_EXECUTION_WORKSPACE_TIMEOUT_SECONDS:900}
      global-assistant-timeout-seconds: ${SPEC_AGENT_EXECUTION_GA_TIMEOUT_SECONDS:180}
      # 队列与范围容量上限(入队前检查,数据库级串行化)。
      max-queued-tasks: ${SPEC_AGENT_EXECUTION_MAX_QUEUED_TASKS:1000}
      max-queued-per-scope: ${SPEC_AGENT_EXECUTION_MAX_QUEUED_PER_SCOPE:20}
      # 优雅退出:到上限后停止续租与新调用,留给新 Worker 按账本恢复。
      shutdown-drain-seconds: ${SPEC_AGENT_EXECUTION_SHUTDOWN_DRAIN_SECONDS:30}
      # GA 自动恢复是"两步走"的第二步(design §7):默认关闭,租约过期的 GA 任务
      # 一律诚实失败。只有经过故障验证后才应开启——即便开启,存在未决(RESERVED/
      # UNKNOWN)调用时仍会拒绝接管,因为外部副作用可能已经发生。
      ga-recovery-enabled: ${SPEC_AGENT_EXECUTION_GA_RECOVERY_ENABLED:false}
