spring:
  application:
    name: spec-agent
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://${SPEC_AGENT_DB_HOST:localhost}:${SPEC_AGENT_DB_PORT:5434}/${SPEC_AGENT_DB_NAME:spec_agent}
    username: ${SPEC_AGENT_DB_USER:spec_agent}
    password: ${SPEC_AGENT_DB_PASSWORD:spec_agent_dev}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.specagent: INFO
    org.springframework.jdbc: WARN
    org.flywaydb: INFO

spec:
  agent:
    action-eligibility:
      mode: ${SPEC_AGENT_ACTION_ELIGIBILITY_MODE:enforced}
    model:
      # Normal product execution always resolves the global settings aggregate.
      # The fake gateway is test-only and must be selected explicitly there.
      gateway: ${SPEC_AGENT_MODEL_GATEWAY:opencode}
      # Lower-level inference seam used by the internal broker for the Python
      # brain. Shares the frozen OpenCode transport; fake is test-only.
      inference: ${SPEC_AGENT_MODEL_INFERENCE:opencode}
      # Production remains database-backed. The live evaluation suite opts
      # into external-environment explicitly and never falls back to a DB row.
      runtime-settings-source: ${SPEC_AGENT_MODEL_RUNTIME_SETTINGS_SOURCE:database}
      opencode:
        settings-timeout-seconds: ${SPEC_AGENT_OPENCODE_SETTINGS_TIMEOUT_SECONDS:45}
    brain:
      # Post-cutover production runtime. The async AgentRun path (Answer /
      # Draft / Spec / Regenerate / NodeQuery) is the ONLY production mutation
      # path, so both the remote Python brain boundary and the background
      # worker are ON by default in the default profile. Every queued run must
      # have a live executor; disable these only for tests or special
      # deployments that intentionally run API-only pods.
      enabled: ${SPEC_AGENT_BRAIN_ENABLED:true}
      base-url: ${SPEC_AGENT_BRAIN_BASE_URL:http://localhost:8100}
      internal-secret: ${SPEC_AGENT_BRAIN_INTERNAL_SECRET:dev-internal-secret}
      engine: ${SPEC_AGENT_BRAIN_ENGINE:remote-python}
      worker:
        # Must stay enabled in any deployment whose API accepts
        # POST /agent-runs; the health endpoint reports AGENT_WORKER_UNAVAILABLE
        # when this process accepts runs without its own executor.
        enabled: ${SPEC_AGENT_BRAIN_WORKER_ENABLED:true}
        poll-interval-ms: ${SPEC_AGENT_BRAIN_WORKER_POLL_INTERVAL_MS:2000}
      broker:
        max-prompt-chars: ${SPEC_AGENT_BROKER_MAX_PROMPT_CHARS:200000}
        max-output-tokens: ${SPEC_AGENT_BROKER_MAX_OUTPUT_TOKENS:32768}
    loop:
      # Total AgentRuns allowed in one autonomous continuation chain, the
      # chain root (cycle 0) included. Bounds execution volume only; the
      # remaining budget always derives from the persisted cycle index, so
      # no remaining-budget counter is stored anywhere.
      max-cycles: ${SPEC_AGENT_LOOP_MAX_CYCLES:3}
    capability:
      # Deterministic planner-facing capability catalog bounds. Model output
      # can never change these limits.
      max-visible: ${SPEC_AGENT_CAPABILITY_CATALOG_MAX_VISIBLE:32}
      max-descriptor-bytes: ${SPEC_AGENT_CAPABILITY_CATALOG_MAX_DESCRIPTOR_BYTES:2048}
      max-description-chars: ${SPEC_AGENT_CAPABILITY_CATALOG_MAX_DESCRIPTION_CHARS:320}
