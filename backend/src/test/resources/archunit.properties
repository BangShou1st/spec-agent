# ArchUnit configuration.
#
# ArchitectureTests.packagesAreFreeOfCycles wraps its slice rule in
# FreezingArchRule. The frozen baseline lives in backend/archunit_store and is
# committed on purpose: it records the package cycles that the 2026-09-19 audit
# documented as known and accepted, so only NEW cycles fail the build.
#
# allowStoreCreation=true  -> the archive can be created on a fresh checkout.
# allowStoreUpdate=true    -> when a cycle is actually removed, rerunning the
#                             test rewrites the (shrunken) archive, and that
#                             diff is reviewed and committed.
freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreUpdate=true
