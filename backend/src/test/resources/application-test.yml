spring:
  application:
    name: spec-agent
  datasource:
    url: jdbc:postgresql://localhost:5434/spec_agent_test
    username: spec_agent
    password: spec_agent_dev
    driver-class-name: org.postgresql.Driver
    hikari:
      # Idempotency-concurrency tests race several real HTTP threads; a pool
      # of 2 starves them behind connection waits. 8 keeps the suite
      # deterministic while staying small.
      maximum-pool-size: 8
      minimum-idle: 0
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.specagent: DEBUG
    org.springframework.jdbc: DEBUG
    org.flywaydb: DEBUG

spec:
  agent:
    model:
      gateway: fake
      inference: fake
    brain:
      # Tests drive RunWorker synchronously through test drivers; the
      # background poller stays off to keep runs deterministic.
      enabled: false
      engine: ${SPEC_AGENT_BRAIN_ENGINE:fake}
      worker:
        enabled: false
