spring:
  application:
    name: spec-agent
  datasource:
    url: jdbc:postgresql://localhost:5434/spec_agent
    username: spec_agent
    password: spec_agent_dev
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.specagent: DEBUG
    org.springframework.jdbc: DEBUG
    org.flywaydb: DEBUG

spec:
  agent:
    credential:
      # Test-only master key. Never a real secret: it only proves the
      # encryption path works in automated tests.
      master-key: spec-agent-test-master-key-8c3f96b2
    model:
      opencode:
        model: ${SPEC_AGENT_OPENCODE_MODEL:}
        timeout-seconds: 45