spring:
  application:
    name: spec-agent
  datasource:
    url: jdbc:postgresql://localhost:5434/spec_agent_test
    username: spec_agent
    password: spec_agent_dev
    driver-class-name: org.postgresql.Driver
    hikari:
      # Idempotency-concurrency tests race several real HTTP threads; a pool
      # of 2 starves them behind connection waits. 8 keeps the suite
      # deterministic while staying small.
      maximum-pool-size: 8
      minimum-idle: 0
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.specagent: DEBUG
    org.springframework.jdbc: DEBUG
    org.flywaydb: DEBUG

spec:
  agent:
    action-eligibility:
      # Existing deterministic corpus behavior remains a shadow baseline;
      # focused enforcement tests opt in explicitly.
      mode: ${SPEC_AGENT_ACTION_ELIGIBILITY_MODE:shadow}
    model:
      gateway: fake
      inference: fake
    brain:
      # Tests drive RunWorker synchronously through test drivers; the
      # background poller stays off to keep runs deterministic.
      enabled: false
      engine: ${SPEC_AGENT_BRAIN_ENGINE:fake}
      worker:
        enabled: false
    semantic-trace:
      enabled: true
    secret:
      # Deterministic test master key (32 bytes base64) so connection tests
      # exercise the real AES-GCM secret path without a runtime env var.
      master-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    mcp:
      # Fake in-process MCP servers live on 127.0.0.1 in tests.
      allow-localhost-http: true
