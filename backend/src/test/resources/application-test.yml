spring:
  application:
    name: spec-agent
  datasource:
    url: jdbc:postgresql://localhost:5434/spec_agent
    username: spec_agent
    password: spec_agent_dev
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.specagent: DEBUG
    org.springframework.jdbc: DEBUG
    org.flywaydb: DEBUG

spec:
  agent:
    model:
      gateway: fake
