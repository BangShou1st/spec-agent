name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: spec_agent_test
          POSTGRES_USER: spec_agent
          POSTGRES_PASSWORD: spec_agent_dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U spec_agent -d spec_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run backend tests with the explicit deterministic test gateway
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          SPEC_AGENT_MODEL_GATEWAY: fake
        run: bash gradlew cleanTest test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit -- --run
      - name: Production build
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: spec_agent_test
          POSTGRES_USER: spec_agent
          POSTGRES_PASSWORD: spec_agent_dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U spec_agent -d spec_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install the deterministic Chromium runtime
        working-directory: frontend
        run: npx playwright install chromium
      - name: Start backend with the explicit test profile and Fake gateway
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          SPEC_AGENT_MODEL_GATEWAY: fake
          SPEC_AGENT_BRAIN_ENABLED: true
          SPEC_AGENT_BRAIN_WORKER_ENABLED: true
          SERVER_PORT: 8080
          SPEC_AGENT_DB_PORT: 5434
        run: |
          nohup bash gradlew bootRun > ../backend-e2e.log 2>&1 &
          backend_pid=$!
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend is ready (pid ${backend_pid})"
              break
            fi
            if ! kill -0 "${backend_pid}" 2>/dev/null; then
              echo "Backend exited before becoming ready"
              cat ../backend-e2e.log
              exit 1
            fi
            sleep 2
          done
          if ! curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then
            echo "Backend did not become ready"
            cat ../backend-e2e.log
            exit 1
          fi
      - name: Run deterministic Playwright E2E
        working-directory: frontend
        env:
          SPRING_PROFILES_ACTIVE: test
          SPEC_AGENT_MODEL_GATEWAY: fake
        run: npm run test:e2e
