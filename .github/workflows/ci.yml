name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: spec_agent
          POSTGRES_USER: spec_agent
          POSTGRES_PASSWORD: spec_agent_dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U spec_agent -d spec_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run backend tests with the explicit deterministic test gateway
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          SPEC_AGENT_MODEL_GATEWAY: fake
        run: ./gradlew cleanTest test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit -- --run
      - name: Production build
        working-directory: frontend
        run: npm run build
