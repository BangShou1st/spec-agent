name: CI

on:
  push:
    branches:
      - main
      # Active development branch: direct pushes must run the full CI too.
      - system-bugfix-v1
  pull_request:

permissions:
  contents: read

# Toolchain / runner policy (tech-debt #15):
# - Actions are pinned to the latest majors whose runtime is Node 24
#   (checkout v7, setup-node v7, setup-java v6, setup-python v7,
#   upload-artifact v7). The former v4/v5 majors still targeted the
#   deprecated Node 20 runtime and produced the forced-migration warnings.
# - The runner is pinned to `ubuntu-26.04`, the GA image the `ubuntu-latest`
#   alias migrates to between 2026-10-19 and 2026-11-19
#   (actions/runner-images#14748). Running on it now validates the whole
#   toolchain on the new image instead of being flipped mid-window, and keeps
#   the jobs reproducible.
# - Project language versions are unchanged: backend JDK 21, frontend Node 24,
#   brain Python 3.11, Postgres 17 service container. Only the runner OS and
#   the action runtimes move.

jobs:
  backend:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: spec_agent_test
          POSTGRES_USER: spec_agent
          POSTGRES_PASSWORD: spec_agent_dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U spec_agent -d spec_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run backend tests with the explicit deterministic test gateway
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          SPEC_AGENT_MODEL_GATEWAY: fake
        run: bash gradlew cleanTest test

  eval-baseline:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: spec_agent_test
          POSTGRES_USER: spec_agent
          POSTGRES_PASSWORD: spec_agent_dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U spec_agent -d spec_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Blocking: scenario schema/corpus validation, Layer A, B-fast,
      # production call-budget checks. No live provider, no judge model,
      # no token/cost/latency thresholds.
      - name: Run deterministic P2 evaluation harness (B-fast)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          SPEC_AGENT_MODEL_GATEWAY: fake
        run: bash gradlew evalBFast
      - name: Upload baseline artifacts
        uses: actions/upload-artifact@v7
        with:
          name: eval-baseline
          path: backend/build/eval-baseline/
          if-no-files-found: error

  # Deterministic Python brain unit tests. The suite is offline-safe: model
  # behavior comes from recorded fixtures and fake responses, never a paid
  # provider. Also validates the shared contracts/fixtures corpus on the
  # Python side (test_contracts.py).
  brain:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent-brain/pyproject.toml
      - name: Install the brain package with dev dependencies
        working-directory: agent-brain
        run: pip install -e '.[dev]'
      - name: Run Python brain unit tests (deterministic, no paid model)
        working-directory: agent-brain
        run: pytest -q

  # Cross-language contract validation (the Java <-> Python exit gate):
  # a broker-mode agent-brain dials back into the test process's fake
  # model-inference broker, so the round trip never touches a paid provider.
  cross-language:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: spec_agent_test
          POSTGRES_USER: spec_agent
          POSTGRES_PASSWORD: spec_agent_dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U spec_agent -d spec_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent-brain/pyproject.toml
      - name: Install the brain package
        working-directory: agent-brain
        run: pip install -e .
      - name: Start the broker-mode brain (callbacks hit the fake gateway)
        working-directory: agent-brain
        env:
          SPEC_AGENT_BRAIN_MODEL_MODE: broker
          SPEC_AGENT_INTERNAL_BROKER_URL: http://localhost:8099/internal/v1/model-inference
          # Must match the Spring test default (SPEC_AGENT_BRAIN_INTERNAL_SECRET:
          # dev-internal-secret). The brain defaults to an EMPTY secret when the
          # variable is unset, and the broker then rejects every inference call
          # with 401 (surfaced as brain_unavailable).
          SPEC_AGENT_BRAIN_INTERNAL_SECRET: dev-internal-secret
        run: |
          nohup uvicorn spec_agent_brain.app:app --host 127.0.0.1 --port 8100 > ../brain-ci.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8100/health > /dev/null; then
              echo "Brain is ready"
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent http://localhost:8100/health > /dev/null; then
            echo "Brain did not become ready"
            cat ../brain-ci.log
            exit 1
          fi
      - name: Run the cross-language contract exit gate
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          SPEC_AGENT_MODEL_GATEWAY: fake
          SPEC_AGENT_CROSS_LANG_PORT: 8099
        run: |
          if ! bash gradlew testCrossLanguage; then
            echo "--- agent-brain log ---"
            cat ../brain-ci.log
            exit 1
          fi

  frontend:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit -- --run
      - name: Production build
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: spec_agent_test
          POSTGRES_USER: spec_agent
          POSTGRES_PASSWORD: spec_agent_dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U spec_agent -d spec_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install the deterministic Chromium runtime
        working-directory: frontend
        run: npx playwright install chromium
      - name: Start backend with the explicit test profile and Fake gateway
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          SPEC_AGENT_MODEL_GATEWAY: fake
          SPEC_AGENT_BRAIN_ENABLED: true
          SPEC_AGENT_BRAIN_WORKER_ENABLED: true
          SERVER_PORT: 8080
          SPEC_AGENT_DB_PORT: 5434
        run: |
          nohup bash gradlew bootRun > ../backend-e2e.log 2>&1 &
          backend_pid=$!
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend is ready (pid ${backend_pid})"
              break
            fi
            if ! kill -0 "${backend_pid}" 2>/dev/null; then
              echo "Backend exited before becoming ready"
              cat ../backend-e2e.log
              exit 1
            fi
            sleep 2
          done
          if ! curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then
            echo "Backend did not become ready"
            cat ../backend-e2e.log
            exit 1
          fi
      - name: Run deterministic Playwright E2E
        working-directory: frontend
        env:
          SPRING_PROFILES_ACTIVE: test
          SPEC_AGENT_MODEL_GATEWAY: fake
        run: npm run test:e2e
