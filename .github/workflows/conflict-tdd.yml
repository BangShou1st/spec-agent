name: Conflict TDD

on:
  pull_request:

permissions:
  contents: read

jobs:
  python-conflict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent-brain/pyproject.toml
      - name: Install agent brain test dependencies
        working-directory: agent-brain
        run: pip install -e '.[dev]'
      - name: Run full agent brain suite
        working-directory: agent-brain
        run: pytest -q
