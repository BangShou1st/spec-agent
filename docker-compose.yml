services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: spec-agent-postgres
    environment:
      POSTGRES_DB: spec_agent
      POSTGRES_USER: spec_agent
      POSTGRES_PASSWORD: spec_agent_dev
    ports:
      # 只绑定回环接口:数据库不对局域网暴露。本机工具 psql 直连
      # 127.0.0.1:5434;确实需要远程访问时由部署者显式修改并自行评估风险。
      - "127.0.0.1:5434:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - spec-agent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spec_agent -d spec_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The Python agent-brain no longer runs in Docker: start-dev.bat boots it
  # on the host (agent-brain/.venv + uvicorn, port 8100) so it always runs
  # the local source and reaches the backend broker over plain localhost.

volumes:
  spec-agent-postgres-data:
