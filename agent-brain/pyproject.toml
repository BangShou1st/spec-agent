[project]
name = "spec-agent-brain"
version = "0.1.0"
description = "Spec Agent V2 Python decision engine (agent-brain service)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "langchain==1.4.3",
    "langchain-core==1.6.6",
    "langgraph==1.2.12",
    "langgraph-checkpoint==4.2.0",
    "jsonschema==4.26.0",
    "langchain-ollama==1.1.0",
    "ollama==0.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
